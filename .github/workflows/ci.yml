# filename: .github/workflows/ci.yml
# purpose: CI pipeline — linting + smoke tests on every push/PR to main


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 backend/ --max-line-length=140

      - name: Run tests
        run: pytest tests/ -v